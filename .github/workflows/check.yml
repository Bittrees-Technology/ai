name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --check apps/remote-web/app.js
      - run: node --check apps/remote-web/controller.js
      - run: npm test
      - run: npm run contracts
      - run: git diff --exit-code -- contracts/
      - run: npm run build

  autonote-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: autonote_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Bittrees-Technology/autonote
          ref: 78023033431c1f45e6b8b203321e1b48215fd803
          path: .integration/autonote
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Bittrees-Technology/crm
          ref: daa4ef1ca690c67d0a837838a4a5575a0b3136eb
          path: .integration/crm
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Bittrees-Technology/news
          ref: 2d0059e75be2012bcdd19451b69c625ae695070d
          path: .integration/news
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix .integration/news
      - run: npm ci --prefix .integration/autonote
      - run: npm ci --prefix .integration/crm
      - name: Actual companion, AutoNote and CRM synthetic acceptance
        run: npx tsx scripts/autonote-integration-check.ts
        env:
          DATABASE_URL: postgresql://integration:ci-only@127.0.0.1:5432/autonote_test
          AUTONOTE_REPO: .integration/autonote
          CRM_REPO: .integration/crm
      - name: Actual News read, curation and publication journal acceptance
        run: npx tsx scripts/news-integration-check.ts
        env:
          NEWS_MCP_TEST_DATABASE_URL: postgresql://integration:ci-only@127.0.0.1:5432/autonote_test
          NEWS_REPO: .integration/news

  remote-status-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: relay_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:remote
      - run: npx tsx scripts/remote-status-integration-check.ts
        env:
          REMOTE_TEST_DATABASE_URL: postgresql://integration:ci-only@127.0.0.1:5432/relay_test

  macos-package:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Native recovery lifecycle and shell typecheck
        run: bash scripts/check-macos-recovery.sh
      - name: Add-only synthetic Keychain installation
        run: bash scripts/check-macos-key-install.sh
      - name: Seed stale build outputs for rebuild regression
        run: |
          mkdir -p dist/apps 'dist/macos/Bittrees AI.app/Contents/Resources'
          touch dist/apps/stale-build-probe.js 'dist/macos/Bittrees AI.app/Contents/Resources/stale-bundle-probe'
      - run: bash scripts/package-macos.sh
      - name: Packaged recovery with disposable Keychain profile
        run: '"dist/macos/Bittrees AI.app/Contents/Resources/node" scripts/check-packaged-key-recovery.mjs "$PWD/dist/macos/Bittrees AI.app/Contents/Resources"'
      - name: Build untrusted native reader for endpoint-key denial check
        run: xcrun swiftc -parse-as-library tests/macos-private-key-denial.swift -o "$RUNNER_TEMP/private-key-denial" -framework Security
      - name: Packaged private endpoint keys with disposable Keychain slots
        timeout-minutes: 2
        run: '"dist/macos/Bittrees AI.app/Contents/Resources/node" scripts/check-packaged-private-keys.mjs "$PWD/dist/macos/Bittrees AI.app/Contents/Resources" "$RUNNER_TEMP/private-key-denial"'
      - name: Packaged private relay custody with disposable Keychain slots
        timeout-minutes: 2
        run: '"dist/macos/Bittrees AI.app/Contents/Resources/node" scripts/check-packaged-private-relay.mjs "$PWD/dist/macos/Bittrees AI.app/Contents/Resources" "$RUNNER_TEMP/private-key-denial"'
      - name: Deleted outputs must not survive packaging
        run: |
          test ! -e 'dist/macos/Bittrees AI.app/Contents/Resources/engine/dist/apps/stale-build-probe.js'
          test ! -e 'dist/macos/Bittrees AI.app/Contents/Resources/stale-bundle-probe'
      - name: Archive development bundle preserving executable permissions
        run: ditto -c -k --sequesterRsrc --keepParent 'dist/macos/Bittrees AI.app' dist/macos/Bittrees-AI-development.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Bittrees-AI-macOS-development
          path: dist/macos/Bittrees-AI-development.zip
          retention-days: 7

  browser-private-protocol:
    runs-on: ubuntu-latest
    # The prior 933-case suite took 21 minutes; allow added full-page task flows
    # and previews while keeping per-test timeouts, retries and failure caps fixed.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: browser_identity_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BROWSER_TEST_DATABASE_URL: postgresql://integration:ci-only@127.0.0.1:5432/browser_identity_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare pinned browser key compatibility providers
        run: |
          git fetch --no-tags --depth=1 origin 84132a15d0ddf6027bc9bc8d8d9dbf4217fa69f0
          git fetch --no-tags --depth=1 origin 99a3c5e3a408305438f718e3326363b656234c9e
          git fetch --no-tags --depth=1 origin 3d692912ebecb14a04748b92226435ef1eb36e9f
          node scripts/prepare-legacy-browser-keys.mjs
          node scripts/prepare-legacy-browser-lifecycle.mjs
          node scripts/prepare-legacy-browser-private.mjs
          git fetch --no-tags --depth=1 origin b586ce3cd85f6320b51c78626498a3015a657e77
          node scripts/prepare-legacy-browser-consent.mjs
          git fetch --no-tags --depth=1 origin 9fbecfcc864843fc59fd43daf447f65178244be7
          node scripts/prepare-legacy-browser-composition.mjs
      - name: Install disposable CI browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build:remote
      - name: Check narrow permission layout before full suite
        run: npm run test:browser-private -- tests/browser/production-browser-permissions.spec.ts --project=webkit --grep 'permission choices, review and history' --max-failures=1
      - name: Check reviewed task flow before full suite
        run: npm run test:browser-private -- tests/browser/production-browser-tasks.spec.ts --project=chromium --grep 'built task controls review exact input' --max-failures=1
      - name: Verify browser and companion private-protocol interoperability
        run: npm run test:browser-private -- --max-failures=3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-browser-results
          path: test-results/private-browser.json
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-results-ui-preview
          path: test-results/private-results-*.png
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-keys-ui-preview
          path: test-results/private-keys-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain Mac peer review previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-peers-ui-preview
          path: test-results/private-peers-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain Mac task permission previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-permissions-ui-preview
          path: test-results/private-permissions-*.png
          if-no-files-found: error
