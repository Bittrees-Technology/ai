name: Verified Mac download
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verified-mac-download
  cancel-in-progress: false
jobs:
  eligibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require successful checks for this main revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == Bittrees-Technology/ai ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f status=success \
            --jq '.workflow_runs | any(.conclusion == "success")' | grep -qx true
  package:
    needs: eligibility
    runs-on: macos-14
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the development app
        run: bash scripts/package-macos.sh
      - name: Prepare archive and factual download manifest
        run: node scripts/prepare-macos-download.mjs
      - name: Attest archive and manifest provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/download/*
      - name: Verify expected repository, workflow, revision and runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/verify-macos-download.sh dist/download/Bittrees-AI-macOS-arm64-development.zip "$GITHUB_SHA"
          bash scripts/verify-macos-download.sh dist/download/download.json "$GITHUB_SHA"
      - name: Retain downloadable files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Bittrees-AI-verified-development-download
          path: dist/download/*
          if-no-files-found: error
          retention-days: 30
